<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>architrace — 9 architectures 3D</title>
<style>
:root {
    --bg: #050505;
    --fg: #f0f0e8;
    --dim: #5a5a4a;
    --cyan: #00ffff;
    --magenta: #ff00aa;
    --yellow: #ffe600;
    --green: #00ff88;
    --orange: #ff8800;
    --purple: #aa66ff;
    --red: #ff3344;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PP Neue Bit', 'Chakra Petch', -apple-system, monospace; }
html, body { width: 100%; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
canvas { display: block; }

#ui-top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 18px; background: linear-gradient(180deg, rgba(0,0,0,0.92), rgba(0,0,0,0));
    pointer-events: none;
}
#ui-top h1 {
    font-size: 14px; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--fg); margin-bottom: 6px;
}
#ui-top .subtitle {
    font-size: 11px; color: var(--dim); letter-spacing: 0.05em;
}

#tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 18px 18px;
    background: linear-gradient(0deg, rgba(0,0,0,0.92), rgba(0,0,0,0));
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
}
.tab {
    padding: 6px 12px; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase;
    border: 1px solid var(--dim); color: var(--dim); background: transparent;
    cursor: pointer; transition: all 0.18s ease;
}
.tab:hover { color: var(--fg); border-color: var(--fg); }
.tab.active { color: var(--cyan); border-color: var(--cyan); background: rgba(0,255,255,0.06); }

#arch-info {
    position: fixed; top: 50px; left: 18px; z-index: 9;
    max-width: 320px;
    background: rgba(0,0,0,0.7); border: 1px solid var(--dim);
    padding: 12px; backdrop-filter: blur(8px);
    font-size: 11px; line-height: 1.6;
}
#arch-info .arch-name {
    color: var(--cyan); font-size: 13px; letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 4px;
}
#arch-info .arch-sprint {
    color: var(--yellow); font-size: 10px; margin-bottom: 8px;
}
#arch-info .arch-desc {
    color: var(--fg); margin-bottom: 8px;
}
#arch-info .arch-meta {
    color: var(--dim); font-size: 10px;
}

#tooltip {
    position: fixed; pointer-events: none; z-index: 100;
    background: rgba(10,10,10,0.95); border: 1px solid var(--cyan);
    padding: 10px 12px; max-width: 280px;
    font-size: 11px; line-height: 1.5;
    box-shadow: 0 0 24px rgba(0,255,255,0.2);
    display: none;
    backdrop-filter: blur(8px);
}
#tooltip .tt-name {
    color: var(--cyan); font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 4px;
}
#tooltip .tt-role {
    color: var(--fg); margin-bottom: 6px;
}
#tooltip .tt-dim {
    color: var(--magenta); font-size: 10px; font-family: 'PP Neue Bit', monospace;
    margin-bottom: 4px;
}
#tooltip .tt-train {
    color: var(--green); font-size: 10px;
}
#tooltip .tt-train.frozen { color: var(--orange); }
#tooltip .tt-sprint {
    color: var(--yellow); font-size: 9px; margin-top: 6px; opacity: 0.7;
}

#legend {
    position: fixed; top: 50px; right: 18px; z-index: 9;
    background: rgba(0,0,0,0.7); border: 1px solid var(--dim);
    padding: 10px 12px; font-size: 10px; line-height: 1.8;
    backdrop-filter: blur(8px);
}
#legend .legend-title { color: var(--dim); margin-bottom: 4px; letter-spacing: 0.1em; }
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-dot { width: 10px; height: 10px; border-radius: 1px; }

#instructions {
    position: fixed; bottom: 80px; left: 18px; z-index: 9;
    font-size: 10px; color: var(--dim); letter-spacing: 0.05em;
}
</style>
</head>
<body>

<div id="ui-top">
    <h1>architrace — 9 architectures self-référentielles</h1>
    <div class="subtitle">click hover sur les modules · drag pour rotation · scroll pour zoom</div>
</div>

<div id="arch-info">
    <div class="arch-name" id="arch-name">—</div>
    <div class="arch-sprint" id="arch-sprint">—</div>
    <div class="arch-desc" id="arch-desc">—</div>
    <div class="arch-meta" id="arch-meta">—</div>
</div>

<div id="legend">
    <div class="legend-title">MODULE TYPES</div>
    <div class="legend-item"><span class="legend-dot" style="background:#00ffff"></span> Input/Output</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ff00aa"></span> Body/Transformer</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ffe600"></span> Fusion</div>
    <div class="legend-item"><span class="legend-dot" style="background:#00ff88"></span> Predictor/State</div>
    <div class="legend-item"><span class="legend-dot" style="background:#aa66ff"></span> Observer</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ff3344"></span> Loss/Aux</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ff8800"></span> LoRA/Adapter</div>
</div>

<div id="instructions">
    [mouse] orbit · [wheel] zoom · [hover module] details
</div>

<div id="tabs"></div>

<div id="tooltip">
    <div class="tt-name"></div>
    <div class="tt-role"></div>
    <div class="tt-dim"></div>
    <div class="tt-train"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// =====================================================================
// COULEURS module types
// =====================================================================
const COLOR = {

    FUSION: 0xffe600,

    OBSERVER: 0xaa66ff,

        {id:'observer', label:'Observer VGCNN', role:'render_arch_state → encode self à 16D', dim:'64×64×3 → 16', type:'OBSERVER', train:'frozen', pos:[5,1,0], size:[1.4,0.8,0.8]},
        {id:'aux_loss', label:'Aux Loss MSE', role:'MSE(predicted, actual) = self-coherence', dim:'scalar', type:'LOSS', train:'compute', pos:[3.5,-2,0], size:[1.2,0.6,0.6]},

// =====================================================================
// THREE.JS SETUP
// =====================================================================
let scene, camera, renderer, raycaster, mouse;
let currentArch = 'selfReferentialVG';
let archMeshes = [];
let edgeLines = [];
let hoveredMesh = null;
let rotateGroup;

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.Fog(0x050505, 12, 30);

    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 14);

    renderer = new THREE.WebGLRenderer({antialias: true, alpha: false});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Lights
    const amb = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(amb);
    const dir = new THREE.DirectionalLight(0xffffff, 0.6);
    dir.position.set(5, 5, 8);
    scene.add(dir);

    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2(-2, -2);

    rotateGroup = new THREE.Group();
    scene.add(rotateGroup);

    // Build initial arch
    buildArch(currentArch);

    // Orbit controls (manual minimal)
    setupOrbit();
    setupTabs();

    window.addEventListener('resize', onResize);
    window.addEventListener('mousemove', onMouseMove);
    animate();
}

function clearArch() {
    while (rotateGroup.children.length > 0) {
        const obj = rotateGroup.children[0];
        rotateGroup.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
            if (obj.material.dispose) obj.material.dispose();
        }
    }
    archMeshes = [];
    edgeLines = [];
}

function buildArch(archKey) {
    clearArch();
    const arch = ARCHS[archKey];
    if (!arch) return;

    document.getElementById('arch-name').textContent = arch.name;
    document.getElementById('arch-sprint').textContent = arch.sprint;
    document.getElementById('arch-desc').textContent = arch.description;
    document.getElementById('arch-meta').textContent = arch.meta;

    const moduleById = {};

    // Build module boxes
    for (const m of arch.modules) {
        const color = COLOR[m.type] || 0x888888;
        const geom = new THREE.BoxGeometry(m.size[0], m.size[1], m.size[2]);
        const mat = new THREE.MeshPhongMaterial({
            color: color,
            emissive: color,
            emissiveIntensity: 0.4,
            transparent: true,
            opacity: 0.85,
            shininess: 80,
        });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(m.pos[0], m.pos[1], m.pos[2]);
        mesh.userData = m;
        rotateGroup.add(mesh);
        archMeshes.push(mesh);
        moduleById[m.id] = mesh;

        // Wireframe edge
        const edges = new THREE.EdgesGeometry(geom);
        const lineMat = new THREE.LineBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.25});
        const wire = new THREE.LineSegments(edges, lineMat);
        wire.position.copy(mesh.position);
        rotateGroup.add(wire);

        // Text label as sprite
        const label = makeTextSprite(m.label, color);
        label.position.set(m.pos[0], m.pos[1] + m.size[1]/2 + 0.25, m.pos[2]);
        rotateGroup.add(label);
    }

    // Build edges
    for (const [a, b] of arch.edges) {
        const ma = moduleById[a]; const mb = moduleById[b];
        if (!ma || !mb) continue;
        const points = [ma.position.clone(), mb.position.clone()];
        const geom = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.35,
        });
        const line = new THREE.Line(geom, mat);
        rotateGroup.add(line);
        edgeLines.push(line);
    }

    // Auto-center group
    const box = new THREE.Box3().setFromObject(rotateGroup);
    const center = box.getCenter(new THREE.Vector3());
    rotateGroup.position.sub(center);
    const size = box.getSize(new THREE.Vector3());
    const maxSize = Math.max(size.x, size.y, size.z);
    camera.position.set(0, 0, Math.max(maxSize * 1.6, 10));
}

function makeTextSprite(text, color = 0xffffff) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const fontSize = 32;
    ctx.font = `${fontSize}px monospace`;
    const metrics = ctx.measureText(text);
    canvas.width = Math.ceil(metrics.width) + 20;
    canvas.height = fontSize + 12;
    ctx.font = `${fontSize}px monospace`;
    ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
    ctx.shadowColor = '#' + color.toString(16).padStart(6, '0');
    ctx.shadowBlur = 8;
    ctx.fillText(text, 10, fontSize);
    const tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    const mat = new THREE.SpriteMaterial({map: tex, transparent: true});
    const sprite = new THREE.Sprite(mat);
    const scaleX = canvas.width / 100;
    sprite.scale.set(scaleX, canvas.height / 100, 1);
    return sprite;
}

// =====================================================================
// ORBIT controls (minimal)
// =====================================================================
let isDragging = false, lastX = 0, lastY = 0;
let groupRotX = 0, groupRotY = 0;
let autoRotate = true;

function setupOrbit() {
    const dom = renderer.domElement;
    dom.addEventListener('mousedown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; autoRotate = false; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastX; const dy = e.clientY - lastY;
        groupRotY += dx * 0.005;
        groupRotX += dy * 0.005;
        groupRotX = Math.max(-1.4, Math.min(1.4, groupRotX));
        lastX = e.clientX; lastY = e.clientY;
    });
    dom.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY > 0 ? 1.1 : 0.9;
        camera.position.z = Math.max(5, Math.min(30, camera.position.z * factor));
    }, {passive: false});
}

function onMouseMove(e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
}

// =====================================================================
// TABS
// =====================================================================
function setupTabs() {
    const container = document.getElementById('tabs');
    container.innerHTML = '';
    for (const [key, arch] of Object.entries(ARCHS)) {
        const btn = document.createElement('button');
        btn.className = 'tab' + (key === currentArch ? ' active' : '');
        btn.textContent = arch.name.split(' ')[0];
        btn.title = arch.name;
        btn.addEventListener('click', () => {
            currentArch = key;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            buildArch(key);
            groupRotX = 0; groupRotY = 0; autoRotate = true;
        });
        container.appendChild(btn);
    }
}

// =====================================================================
// TOOLTIP via raycaster
// =====================================================================
function updateTooltip() {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(archMeshes);
    const tooltip = document.getElementById('tooltip');
    if (hits.length > 0) {
        const m = hits[0].object;
        const d = m.userData;
        if (m !== hoveredMesh) {
            if (hoveredMesh) hoveredMesh.material.emissiveIntensity = 0.4;
            hoveredMesh = m;
            m.material.emissiveIntensity = 1.0;
        }
        tooltip.querySelector('.tt-name').textContent = d.label;
        tooltip.querySelector('.tt-role').textContent = d.role;
        tooltip.querySelector('.tt-dim').textContent = '⊳ ' + d.dim;
        const trainEl = tooltip.querySelector('.tt-train');
        trainEl.textContent = '◆ ' + d.train;
        trainEl.className = 'tt-train' + (d.train === 'frozen' ? ' frozen' : '');
        const sprintEl = tooltip.querySelector('.tt-sprint');
        sprintEl.textContent = ARCHS[currentArch].sprint;
        tooltip.style.display = 'block';
        const evt = window._lastMouseEvent;
        if (evt) {
            tooltip.style.left = (evt.clientX + 14) + 'px';
            tooltip.style.top = (evt.clientY + 14) + 'px';
        }
    } else {
        if (hoveredMesh) {
            hoveredMesh.material.emissiveIntensity = 0.4;
            hoveredMesh = null;
        }
        tooltip.style.display = 'none';
    }
}
window.addEventListener('mousemove', (e) => { window._lastMouseEvent = e; });

// =====================================================================
// ANIMATE
// =====================================================================
function animate() {
    requestAnimationFrame(animate);
    if (autoRotate) {
        groupRotY += 0.003;
    }
    rotateGroup.rotation.y = groupRotY;
    rotateGroup.rotation.x = groupRotX;
    updateTooltip();
    renderer.render(scene, camera);
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>

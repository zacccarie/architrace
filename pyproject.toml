[project]
name = "architrace"
version = "0.1.0"
description = "Fusion VerifyGrowNet × Dynamoscope — architecture vivante × dynamique mesurable"
authors = [{ name = "Zaccarie Aglas" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy",
    "umap-learn",
    "scikit-learn",
    "pydantic>=2",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ipython"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["architrace"]

[tool.architrace.paths]
adaptive_nn = "/Users/zac/claude-code-projects/adaptive-nn"
dynamoscope = "/Users/zac/claude-code-projects/dynamoscope"
dynamoscope_url = "http://127.0.0.1:8770"
